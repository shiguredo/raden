[package]
name = "raden"
version = "2026.2.0"
edition = "2024"
rust-version = "1.95"
description = "2D Vector Graphics Library"
readme = "README.md"
homepage = "https://github.com/shiguredo/raden"
repository = "https://github.com/shiguredo/raden"
license = "Apache-2.0"
include = ["/LICENSE", "/README.md", "/src/**"]
autobenches = false

[workspace]
members = ["pbt"]
exclude = ["fuzz"]

[lib]
bench = false

[[bench]]
harness = false
name = "fill_rect"

[[bench]]
harness = false
name = "fill_rect_smooth"

[[bench]]
harness = false
name = "fill_rect_rotated"

[[bench]]
harness = false
name = "fill_polygon"

[[bench]]
harness = false
name = "fill_shape"

[[bench]]
harness = false
name = "stroke_rect"

[[bench]]
harness = false
name = "stroke_polygon"

[[bench]]
harness = false
name = "stroke_shape"

[[bench]]
harness = false
name = "fill_gradient"

[[bench]]
harness = false
name = "matrix"

[dependencies]
# Cranelift JIT (ピクセル合成パイプラインのネイティブコード生成)
cranelift-codegen = "~0.135"
cranelift-frontend = "~0.135"
cranelift-jit = "~0.135"
cranelift-module = "~0.135"
cranelift-native = "~0.135"

[dev-dependencies]
# ベンチマークフレームワーク
criterion = { version = "0.8", features = ["html_reports"] }
# ベンチマークの乱数生成
rand = { version = "0.10", features = ["chacha"] }
# サンプルの SDL3 ウィンドウ表示
raw_player = "2026.2"
