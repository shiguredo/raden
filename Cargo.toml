[package]
name = "raden"
version = "2026.1.0-canary.1"
edition = "2024"
rust-version = "1.88"
authors = ["Shiguredo Inc."]
license = "Apache-2.0"
description = "2D Vector Graphics Library"
homepage = "https://github.com/shiguredo/raden"
repository = "https://github.com/shiguredo/raden"
readme = "README.md"
autobenches = false

[dependencies]
cranelift-codegen = "=0.128.3"
cranelift-frontend = "=0.128.3"
cranelift-jit = "=0.128.3"
cranelift-module = "=0.128.3"
cranelift-native = "=0.128.3"

[dev-dependencies]
raw_player = "2026.1.0-canary.0"
criterion = { version = "0.8", features = ["html_reports"] }
rand = { version = "0.10", features = ["chacha"] }

[[bench]]
name = "fill_rect"
harness = false

[[bench]]
name = "fill_rect_smooth"
harness = false

[[bench]]
name = "fill_rect_rotated"
harness = false

[[bench]]
name = "fill_polygon"
harness = false

[[bench]]
name = "fill_shape"
harness = false

[[bench]]
name = "stroke_rect"
harness = false

[[bench]]
name = "stroke_polygon"
harness = false

[[bench]]
name = "stroke_shape"
harness = false

[workspace]
members = ["pbt"]
exclude = ["fuzz"]
