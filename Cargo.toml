[package]
name = "raden"
version = "2026.1.0-canary.6"
edition = "2024"
rust-version = "1.91"
authors = ["Shiguredo Inc."]
license = "Apache-2.0"
description = "2D Vector Graphics Library"
homepage = "https://github.com/shiguredo/raden"
repository = "https://github.com/shiguredo/raden"
readme = "README.md"
autobenches = false

[lib]
bench = false

[dependencies]
cranelift-codegen = "=0.130.0"
cranelift-frontend = "=0.130.0"
cranelift-jit = "=0.130.0"
cranelift-module = "=0.130.0"
cranelift-native = "=0.130.0"

[dev-dependencies]
# サンプルの SDL3 ウィンドウ表示
raw_player = "2026.1.0"
# ベンチマークフレームワーク
criterion = { version = "0.8", features = ["html_reports"] }
# ベンチマークの乱数生成
rand = { version = "0.10", features = ["chacha"] }

[[bench]]
name = "fill_rect"
harness = false

[[bench]]
name = "fill_rect_smooth"
harness = false

[[bench]]
name = "fill_rect_rotated"
harness = false

[[bench]]
name = "fill_polygon"
harness = false

[[bench]]
name = "fill_shape"
harness = false

[[bench]]
name = "stroke_rect"
harness = false

[[bench]]
name = "stroke_polygon"
harness = false

[[bench]]
name = "stroke_shape"
harness = false

[[bench]]
name = "fill_gradient"
harness = false

[[bench]]
name = "matrix"
harness = false

[workspace]
members = ["pbt"]
exclude = ["fuzz"]
