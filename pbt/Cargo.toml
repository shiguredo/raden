[package]
name = "pbt"
version = "2026.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Cargo は tests 配下のディレクトリモジュール (main.rs) を自動認識しないため明示する。
[[test]]
name = "prop_font"
path = "tests/prop_font/main.rs"

[dependencies]
raden = { path = ".." }

[dev-dependencies]
# Property-Based Testing (命令的サンプラー)
noprop = "0.2"
